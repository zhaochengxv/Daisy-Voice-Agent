<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>diri</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; user-select: none; -webkit-user-select: none; }
    #panel {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px 12px;
      gap: 12px;
    }
    #orbContainer { width: 92px; height: 92px; flex: 0 0 92px; }
    #orbCanvas { width: 100%; height: 100%; display: block; cursor: pointer; }
    #asrText {
      flex: 0 0 220px;
      width: 220px;
      height: 100%;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.92);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    #asrText.hidden { opacity: 0; }
    #llmOutput {
      flex: 1 1 280px;
      min-width: 0;
      height: 100%;
      padding: 8px 10px;
      overflow-y: auto;
      color: rgba(255, 255, 255, 0.95);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      word-break: break-word;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 10px;
    }
    #llmOutput.hidden { opacity: 0; }
    #llmOutput::-webkit-scrollbar { width: 4px; }
    #llmOutput::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 2px; }
    #llmOutput::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="orbContainer">
      <canvas id="orbCanvas"></canvas>
    </div>
    <div id="asrText" class="hidden"></div>
    <div id="llmOutput" class="hidden"></div>
  </div>
  <script src="float.js"></script>
</body>
</html>
