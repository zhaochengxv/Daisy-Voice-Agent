<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daisy</title>
  <style>
    :root {
      /* 状态主色由 float.js 按 state 写入，整颗胶囊跟随状态呼吸 */
      --accent: #6C6EF5;
      --accent-rgb: 108, 110, 245;
      --glow-opacity: 0.32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ── 玻璃胶囊容器（液态玻璃风，与设置页 .liquid-glass 同语言）── */
    #capsule {
      position: absolute;
      inset: 14px; /* 预留阴影渲染空间 */
      display: flex;
      flex-direction: row;
      align-items: center;
      border-radius: 22px;
      padding: 0 18px;
      gap: 16px;

      /* 深色半透明基底 + 状态色氛围光 */
      background:
        radial-gradient(90% 130% at 15% 0%, rgba(var(--accent-rgb), 0.20) 0%, transparent 55%),
        radial-gradient(90% 140% at 92% 100%, rgba(var(--accent-rgb), 0.10) 0%, transparent 55%),
        linear-gradient(140deg, rgba(24, 26, 40, 0.86) 0%, rgba(16, 17, 28, 0.88) 100%);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);

      /* 边缘描边 + 液态玻璃内高光 */
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1.5px 0.5px rgba(255, 255, 255, 0.22),
        inset 0 8px 22px -6px rgba(255, 255, 255, 0.10),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4),
        inset 0 -10px 24px -8px rgba(0, 0, 0, 0.35),
        /* 状态色外发光 */
        0 0 26px rgba(var(--accent-rgb), var(--glow-opacity)),
        0 12px 30px -8px rgba(0, 0, 0, 0.55);

      transition:
        background 500ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 500ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 顶部抛光面高光 */
    #capsule::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 46%;
      border-radius: 22px 22px 0 0;
      background:
        radial-gradient(70% 100% at 18% 0%, rgba(255,255,255,0.10) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, transparent 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* ── 胶囊流光：一道斜向光泽缓慢扫过玻璃表面（高级质感） ── */
    @keyframes capsuleSheen {
      0%   { transform: translateX(-130%) skewX(-16deg); }
      55%  { transform: translateX(260%) skewX(-16deg); }
      100% { transform: translateX(260%) skewX(-16deg); }
    }
    #sheen {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      border-radius: 22px;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }
    #sheen::before {
      content: "";
      position: absolute;
      top: -24%; bottom: -24%;
      width: 40%;
      left: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05) 42%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 58%, transparent);
      animation: capsuleSheen 9s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* 说话中流光加快，强化"能量流动"感知 */
    #capsule.speaking #sheen::before {
      animation-duration: 4.5s;
    }

    /* ── 左侧 orb ── */
    #orbContainer {
      width: 92px; height: 92px;
      flex: 0 0 92px;
      position: relative;
      z-index: 2;
      cursor: pointer;
      transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* 悬停微浮起 + 光环放大（macOS 穿透 forward 亦转发 mousemove，两平台均生效） */
    #orbContainer:hover { transform: scale(1.05); }
    /* 按下按压缩实感 */
    #orbContainer.pressed { transform: scale(0.93); transition: transform 90ms ease; }
    #orbCanvas {
      width: 100%; height: 100%;
      display: block;
    }
    /* orb 呼吸光环 */
    @keyframes haloBreathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%      { transform: scale(1.08); opacity: 0.85; }
    }
    #orbHalo {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.35) 0%, transparent 65%);
      opacity: 0.6;
      pointer-events: none;
      transition: background 500ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
      animation: haloBreathe 3.2s ease-in-out infinite;
    }
    #orbContainer:hover #orbHalo { opacity: 1; transform: scale(1.12); }

    /* 点击波纹（mousedown 在 orb 上扩散的水波） */
    @keyframes orbRipple {
      0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.55; }
      100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
    }
    .ripple {
      position: absolute;
      width: 92px; height: 92px;
      left: 0; top: 0;
      border-radius: 50%;
      border: 2px solid rgba(var(--accent-rgb), 0.9);
      pointer-events: none;
      z-index: 3;
      animation: orbRipple 620ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── 中区：状态徽标 + ASR 实时文本 ── */
    #middleZone {
      flex: 0 0 200px;
      width: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      z-index: 2;
    }

    @keyframes badgePop {
      0%   { transform: scale(0.82); opacity: 0.4; }
      60%  { transform: scale(1.07); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9); }
      50%      { box-shadow: 0 0 14px rgba(var(--accent-rgb), 1), 0 0 26px rgba(var(--accent-rgb), 0.55); }
    }
    #statusBadge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
      transform-origin: left center;
    }
    /* 状态切换时由 JS 重触发 pop 弹入动画 */
    #statusBadge.pop { animation: badgePop 360ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    #statusBadge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgb(var(--accent-rgb));
      animation: dotPulse 2s ease-in-out infinite;
      transition: background 500ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #asrText {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      max-height: 62px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
      transition: opacity 250ms ease;
    }
    #asrText.hidden { opacity: 0; }
    #asrText.placeholder {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      text-shadow: none;
    }

    /* ── 右区：LLM 滚动输出 ── */
    #llmOutput {
      flex: 1 1 264px;
      min-width: 0;
      height: 100%;
      padding: 10px 12px;
      overflow-y: auto;
      color: rgba(255, 255, 255, 0.95);
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.2px;
      word-break: break-word;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.20);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.25);
      transition: opacity 250ms ease;
      z-index: 2;
    }
    #llmOutput.hidden { opacity: 0; }
    #llmOutput::-webkit-scrollbar { width: 5px; }
    #llmOutput::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
    #llmOutput::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="capsule">
    <div id="orbContainer">
      <div id="orbHalo"></div>
      <canvas id="orbCanvas"></canvas>
    </div>
    <div id="middleZone">
      <div id="statusBadge"><span class="dot"></span><span id="statusLabel">待命</span></div>
      <div id="asrText" class="hidden"></div>
    </div>
    <div id="llmOutput" class="hidden"></div>
    <div id="sheen"></div>
  </div>
  <script src="float.js"></script>
</body>
</html>
