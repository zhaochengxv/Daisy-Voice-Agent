<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daisy</title>
  <style>
    :root {
      /* 状态主色由 float.js 按 state 写入，整颗胶囊跟随状态呼吸 */
      --accent: #6C6EF5;
      --accent-rgb: 108, 110, 245;
      --glow-opacity: 0.32;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ── 玻璃胶囊容器（液态玻璃风，与设置页 .liquid-glass 同语言）── */
    #capsule {
      position: absolute;
      inset: 14px; /* 预留阴影渲染空间 */
      display: flex;
      flex-direction: row;
      align-items: center;
      border-radius: 22px;
      padding: 0 18px;
      gap: 16px;

      /* 深色半透明基底 + 状态色氛围光 */
      background:
        radial-gradient(90% 130% at 15% 0%, rgba(var(--accent-rgb), 0.20) 0%, transparent 55%),
        radial-gradient(90% 140% at 92% 100%, rgba(var(--accent-rgb), 0.10) 0%, transparent 55%),
        linear-gradient(140deg, rgba(24, 26, 40, 0.86) 0%, rgba(16, 17, 28, 0.88) 100%);
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);

      /* 边缘描边 + 液态玻璃内高光（1px 实体边框由 ::after 渐变描边替代） */
      box-shadow:
        inset 0 1.5px 0.5px rgba(255, 255, 255, 0.22),
        inset 0 8px 22px -6px rgba(255, 255, 255, 0.10),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4),
        inset 0 -10px 24px -8px rgba(0, 0, 0, 0.35),
        /* 状态色外发光 */
        0 0 26px rgba(var(--accent-rgb), var(--glow-opacity)),
        0 12px 30px -8px rgba(0, 0, 0, 0.55);

      transition:
        background 500ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 500ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 顶部抛光面高光 */
    #capsule::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 46%;
      border-radius: 22px 22px 0 0;
      background:
        radial-gradient(70% 100% at 18% 0%, rgba(255,255,255,0.10) 0%, transparent 60%),
        linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, transparent 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* 液态玻璃渐变描边：沿边缘「亮白 → 通透 → 暗 → 微亮」过渡，模拟真实玻璃切面的棱线 */
    #capsule::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background:
        linear-gradient(165deg,
          rgba(255,255,255,0.42) 0%,
          rgba(255,255,255,0.12) 30%,
          rgba(255,255,255,0.03) 55%,
          rgba(0,0,0,0.28) 78%,
          rgba(255,255,255,0.14) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      z-index: 6;
    }

    /* ── 胶囊流光：一道斜向光泽缓慢扫过玻璃表面（高级质感） ── */
    @keyframes capsuleSheen {
      0%   { transform: translateX(-130%) skewX(-16deg); }
      55%  { transform: translateX(260%) skewX(-16deg); }
      100% { transform: translateX(260%) skewX(-16deg); }
    }
    #sheen {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 0;
      border-radius: 22px;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }
    #sheen::before {
      content: "";
      position: absolute;
      top: -24%; bottom: -24%;
      width: 40%;
      left: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05) 42%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 58%, transparent);
      animation: capsuleSheen 9s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* 说话中流光加快，强化"能量流动"感知 */
    #capsule.speaking #sheen::before {
      animation-duration: 4.5s;
    }

    /* ── 左侧 orb ── */
    #orbContainer {
      width: 92px; height: 92px;
      flex: 0 0 92px;
      position: relative;
      z-index: 2;
      cursor: pointer;
      /* 注意：悬浮/按压/迷你放大一律在 canvas 渲染循环内实现（有界 lerp），
         不在 DOM 上做 transform/transition —— Windows 透明窗口对 CSS transform
         过渡会逐帧重算合成缓冲导致放大累积（「双击后悬停一直变大」根因）。 */
    }
    /* 悬停操作提示：仅 hover 时淡入，克制的浮出气泡（可发现性，不破坏科技感） */
    #orbHint {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.58);
      background: rgba(8, 9, 18, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
      z-index: 5;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #orbContainer:hover #orbHint { opacity: 1; }
    /* mini 形态：悬浮球即球体本身，提示条会被窗口裁切，隐藏 */
    body.mini #orbHint { display: none; }
    body.win32 #orbHint {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      background: rgba(14, 15, 26, 0.92);
    }
    #orbCanvas {
      width: 100%; height: 100%;
      display: block;
    }
    /* orb 呼吸光环 */
    @keyframes haloBreathe {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%      { transform: scale(1.08); opacity: 0.85; }
    }
    #orbHalo {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.35) 0%, transparent 65%);
      opacity: 0.6;
      pointer-events: none;
      transition: background 500ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
      animation: haloBreathe 3.2s ease-in-out infinite;
    }
    #orbContainer:hover #orbHalo { opacity: 1; }

    /* 点击波纹（mousedown 在 orb 上扩散的水波） */
    @keyframes orbRipple {
      0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.55; }
      100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
    }
    .ripple {
      position: absolute;
      width: 92px; height: 92px;
      left: 0; top: 0;
      border-radius: 50%;
      border: 2px solid rgba(var(--accent-rgb), 0.9);
      pointer-events: none;
      z-index: 3;
      animation: orbRipple 620ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── 中区：状态徽标 + ASR 实时文本 ── */
    #middleZone {
      flex: 0 0 200px;
      width: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      z-index: 2;
    }

    @keyframes badgePop {
      0%   { transform: scale(0.82); opacity: 0.4; }
      60%  { transform: scale(1.07); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.9); }
      50%      { box-shadow: 0 0 14px rgba(var(--accent-rgb), 1), 0 0 26px rgba(var(--accent-rgb), 0.55); }
    }
    #statusBadge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
      transform-origin: left center;
    }
    /* 状态切换时由 JS 重触发 pop 弹入动画 */
    #statusBadge.pop { animation: badgePop 360ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    #statusBadge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgb(var(--accent-rgb));
      animation: dotPulse 2s ease-in-out infinite;
      transition: background 500ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #asrText {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
      max-height: 62px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
      transition: opacity 250ms ease;
    }
    #asrText.hidden { opacity: 0; }
    #asrText.placeholder {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.38);
      text-shadow: none;
    }

    /* ── 右区：LLM 滚动输出 ── */
    #llmOutput {
      flex: 1 1 264px;
      min-width: 0;
      height: 100%;
      padding: 10px 12px;
      overflow-y: auto;
      color: rgba(255, 255, 255, 0.95);
      font-size: 13px;
      line-height: 1.6;
      letter-spacing: 0.2px;
      word-break: break-word;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.20);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.25);
      transition: opacity 250ms ease;
      z-index: 2;
    }
    #llmOutput.hidden { opacity: 0; }
    /* Windows 透明窗口下 backdrop-filter 采样异常（Electron 已知问题，拖动时
       触发布局重算会放大内容），降级为不透明深色玻璃，避免拖动放大 bug。 */
    body.win32 #capsule {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      background:
        radial-gradient(90% 130% at 15% 0%, rgba(var(--accent-rgb), 0.22) 0%, transparent 55%),
        radial-gradient(90% 140% at 92% 100%, rgba(var(--accent-rgb), 0.12) 0%, transparent 55%),
        linear-gradient(140deg, rgba(26, 28, 44, 0.96) 0%, rgba(16, 17, 28, 0.97) 100%);
    }

    /* ── 迷你模式：仅 orb 圆形悬浮球 ── */
    body.mini #middleZone,
    body.mini #llmOutput,
    body.mini #sheen {
      display: none;
    }
    body.mini #capsule {
      border-radius: 50%;
      padding: 0;
      gap: 0;
      justify-content: center;
      align-items: center;
    }
    body.mini #capsule::before {
      border-radius: 50%;
    }
    body.mini #orbContainer {
      flex: none;
      /* 迷你放大并入 canvas orbScale（modeScale），见 float.js */
    }
    /* 迷你形态：球体更大更有存在感，呼吸光环增强（唯一视觉焦点） */
    body.mini #orbHalo { inset: -20px; }
    body.mini #capsule::after {
      border-radius: 50%;
    }
    /* 迷你形态下流光改走球体边缘，强化能量呼吸 */
    body.mini #capsule {
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.18),
        inset 0 -8px 16px -6px rgba(0,0,0,0.5),
        0 0 34px rgba(var(--accent-rgb), calc(var(--glow-opacity) * 1.3)),
        0 12px 32px -6px rgba(0, 0, 0, 0.6);
    }

    /* ── 自绘右键菜单（玻璃质感，与胶囊同语言） ── */
    #floatMenu {
      position: fixed;
      min-width: 168px;
      padding: 6px;
      border-radius: 14px;
      background: linear-gradient(150deg, rgba(28, 30, 46, 0.92), rgba(16, 17, 28, 0.94));
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 18px 48px -8px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 100;
      font-size: 13px;
      user-select: none;
      -webkit-user-select: none;
      transform-origin: top left;
    }
    @keyframes floatMenuIn {
      0%   { transform: scale(0.92) translateY(-4px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    #floatMenu:not(.hidden) { animation: floatMenuIn 170ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    #floatMenu.hidden { display: none; }
    #floatMenu .menu-item {
      padding: 9px 12px;
      border-radius: 9px;
      color: rgba(255, 255, 255, 0.88);
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms ease, color 120ms ease;
    }
    #floatMenu .menu-item:hover { background: rgba(255, 255, 255, 0.10); color: #fff; }
    #floatMenu .menu-item:active { background: rgba(255, 255, 255, 0.16); }
    #floatMenu .menu-item.danger { color: rgba(245, 96, 96, 0.95); }
    #floatMenu .menu-item.danger:hover { background: rgba(245, 96, 96, 0.14); }
    #floatMenu .menu-divider {
      height: 1px;
      margin: 5px 8px;
      background: rgba(255, 255, 255, 0.10);
    }
    body.win32 #floatMenu {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      background: linear-gradient(150deg, rgba(30, 32, 48, 0.97), rgba(18, 19, 32, 0.98));
    }
  </style>

</head>
<body>
  <div id="capsule">
    <div id="orbContainer">
      <div id="orbHalo"></div>
      <canvas id="orbCanvas"></canvas>
      <div id="orbHint">单击录音 · 双击切换形态 · 右键菜单</div>
    </div>
    <div id="middleZone">
      <div id="statusBadge"><span class="dot"></span><span id="statusLabel">待命</span></div>
      <div id="asrText" class="hidden"></div>
    </div>
    <div id="llmOutput" class="hidden"></div>
    <div id="sheen"></div>
  </div>
  <div id="floatMenu" class="hidden">
    <div class="menu-item" data-action="settings">打开设置</div>
    <div class="menu-item" data-action="standard">完整模式</div>
    <div class="menu-item" data-action="mini">迷你模式</div>
    <div class="menu-item" data-action="hide">隐藏悬浮球</div>
    <div class="menu-divider"></div>
    <div class="menu-item danger" data-action="quit">退出 Daisy</div>
  </div>
  <script src="float.js"></script>
</body>
</html>
