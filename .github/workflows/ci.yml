name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # macOS / Windows runner 预装 pwsh，校验 windows.ts 全部 PowerShell 脚本语法；
      # Ubuntu 无 pwsh，check-ps.js 检测不到会自动跳过。
      - name: PowerShell syntax check
        shell: bash
        run: node scripts/check-ps.js
